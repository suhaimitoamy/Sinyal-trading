<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Candlestick bars -->
  <rect x="100" y="200" width="24" height="120" rx="4" fill="#26a69a"/>
  <line x1="112" y1="180" x2="112" y2="340" stroke="#26a69a" stroke-width="4" stroke-linecap="round"/>
  <rect x="160" y="240" width="24" height="100" rx="4" fill="#ef5350"/>
  <line x1="172" y1="220" x2="172" y2="360" stroke="#ef5350" stroke-width="4" stroke-linecap="round"/>
  <rect x="220" y="160" width="24" height="140" rx="4" fill="#26a69a"/>
  <line x1="232" y1="140" x2="232" y2="320" stroke="#26a69a" stroke-width="4" stroke-linecap="round"/>
  <rect x="280" y="180" width="24" height="100" rx="4" fill="#26a69a"/>
  <line x1="292" y1="150" x2="292" y2="300" stroke="#26a69a" stroke-width="4" stroke-linecap="round"/>
  <!-- Gold price line -->
  <path d="M80 300 Q150 260 200 280 T320 200 T420 160" stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- XAU text -->
  <text x="340" y="380" font-family="sans-serif" font-weight="700" font-size="72" fill="url(#gold)">Au</text>
</svg>
